name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Verify
        run: |
          moon version --all
          moon fmt --check
          moon check --deny-warn
          moon test --target native
          moon build --target native
          moon test --target wasm-gc
          moon build --target wasm-gc
      - name: CLI contract
        run: scripts/test_cli.sh
      - name: CLI smoke test
        run: moon run --target native cmd/main check examples/coupon.rule.json

  playground:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - name: Build engine
        run: scripts/build_playground_engine.sh
      - name: Install dependencies
        run: cd playground && npm ci
      - name: Run unit tests
        run: cd playground && npm test
      - name: Build playground
        run: cd playground && npm run build
      - name: Install Playwright Chromium
        run: cd playground && npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: cd playground && npm run test:e2e
